# Compila la web y la publica en GitHub Pages en cada push a main.
# Requisito (una vez): Settings → Pages → Source: "GitHub Actions".
name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Sin permisos por defecto: cada trabajo pide solo los que necesita.
permissions: {}

# Un despliegue a la vez; si llega otro push, el que está en curso termina.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  compilar:
    runs-on: ubuntu-latest
    permissions:
      contents: read # leer el código
      pages: read # configure-pages consulta la URL y la base del sitio
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Sin caché de npm: es lo que recomienda setup-node en flujos que publican
      # (evita el envenenamiento de caché) y la instalación tarda segundos.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: pages
        uses: actions/configure-pages@v6
      - run: npm ci
      - run: npm test
      - run: npx astro check
      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  desplegar:
    needs: compilar
    runs-on: ubuntu-latest
    permissions:
      pages: write # publicar en Pages
      id-token: write # demostrar que el despliegue sale de este repositorio
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v5
