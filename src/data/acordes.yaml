# Voicings personales. Cada uno se escribe sobre una tónica de referencia y la web
# lo transporta moviendo el mismo dibujo de traste.
#
#   nombre:    nombre del voicing (shell, drop 2…); la cuerda del bajo se añade sola
#   grupo:     id de un tipo de acorde de grupos.yaml
#   tonica:    tónica en la que están escritos los trastes
#   trastes:   de 6ª a 1ª cuerda; número de traste, 0 = al aire, x = apagada
#   grados:    de 6ª a 1ª cuerda; '' en las cuerdas apagadas
#   dedos:     opcional, de 6ª a 1ª; '' donde no aplique
#   notas:     texto libre
#
# La cuerda del bajo se deduce: es la primera cuerda tocada empezando por la 6ª.
#
# Los voicings de abajo son EJEMPLOS para probar el modelo: sustitúyelos por los tuyos.

- id: sus-drop3-6
  grupo: sus
  nombre: Drop 3
  tonica: C
  trastes: [8, x, 8, 10, 8, x]
  grados: ['1', '', 'b7', '4', '5', '']
  notas: Voicing de ejemplo.
  en:
    notas: 'Example voicing.'

- id: aug-5
  grupo: aug
  nombre: Tríada
  tonica: C
  trastes: [x, 3, 2, 1, 1, x]
  grados: ['', '1', '3', '#5', '1', '']
  notas: Voicing de ejemplo.
  en:
    nombre: 'Triad'
    notas: 'Example voicing.'

- id: aug-1
  grupo: aug
  nombre: 'Tríada'
  tonica: C
  trastes: [8, 7, 6, x, x, x]
  grados: ['1', '3', '#5', '', '', '']
  notas: 'Tríada en las cuerdas graves.'
  en:
    nombre: 'Triad'
    notas: 'Triad on the low strings.'

- id: aug-2
  grupo: aug
  nombre: 'Tríada'
  tonica: C
  trastes: [x, x, x, 5, 5, 4]
  grados: ['', '', '', '1', '3', '#5']
  notas: 'Tríada en las cuerdas agudas. Se repite cada 4 trastes (es simétrica).'
  en:
    nombre: 'Triad'
    notas: 'Triad on the high strings. It repeats every 4 frets (it is symmetric).'

- id: aug-3
  grupo: aug
  nombre: '7#5'
  tonica: C
  trastes: [8, x, 8, 9, 9, x]
  grados: ['1', '', 'b7', '3', '#5', '']
  notas: 'Dominante aumentado (C7#5): bajo en la 6ª.'
  en:
    notas: 'Augmented dominant (C7#5): bass on the 6th string.'

- id: aug-4
  grupo: aug
  nombre: '7#5'
  tonica: C
  trastes: [x, 3, x, 3, 5, 4]
  grados: ['', '1', '', 'b7', '3', '#5']
  notas: 'Dominante aumentado (C7#5): bajo en la 5ª.'
  en:
    notas: 'Augmented dominant (C7#5): bass on the 5th string.'

- id: aug-6
  grupo: aug
  nombre: 'maj7#5'
  tonica: C
  trastes: [8, x, 9, 9, 9, x]
  grados: ['1', '', '7', '3', '#5', '']
  notas: 'Maj7 aumentado (Cmaj7#5): tónica de la menor melódica (III+maj7).'
  en:
    notas: 'Augmented maj7 (Cmaj7#5): the tonic of melodic minor (III+maj7).'

- id: aug-7
  grupo: aug
  nombre: 'maj7#5'
  tonica: C
  trastes: [x, 3, x, 4, 5, 4]
  grados: ['', '1', '', '7', '3', '#5']
  notas: 'Maj7 aumentado (Cmaj7#5): bajo en la 5ª.'
  en:
    notas: 'Augmented maj7 (Cmaj7#5): bass on the 5th string.'

