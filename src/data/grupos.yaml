# Tipos de acorde. Los usan las secciones Escalas y Acordes para agrupar.
# `arpegio` es la fórmula del acorde en grados; el orden de esta lista es el de la web.

- id: maj7
  nombre: Maj7
  arpegio: ['1', '3', '5', '7']

- id: m7
  nombre: m7
  arpegio: ['1', 'b3', '5', 'b7']

- id: mmaj7
  nombre: mMaj7
  arpegio: ['1', 'b3', '5', '7']

- id: dom7
  nombre: '7'
  descripcion: Dominante
  arpegio: ['1', '3', '5', 'b7']

- id: alt7
  nombre: 7 alterado
  descripcion: Dominante alterado (más tensiones b9, #9, b5, #5)
  arpegio: ['1', '3', 'b7']

- id: m7b5
  nombre: m7b5
  arpegio: ['1', 'b3', 'b5', 'b7']

- id: dim7
  nombre: °7
  # bb7 es enharmónico de 6; se escribe bb7 para que la nota salga con la letra correcta (C°7 → Bbb).
  arpegio: ['1', 'b3', 'b5', 'bb7']
