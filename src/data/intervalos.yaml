# Intervalos. `grado` es el que se usa para calcular la segunda nota desde la tónica.
# `ascendente` y `descendente`: canciones de referencia (solo texto).
# `revisar`: dudas pendientes sobre las referencias; la web no lo muestra.
# `en`: nombre, carácter y canciones en la versión inglesa (si falta, se usan las de aquí).

- id: segunda-menor
  nombre: 2ª menor
  semitonos: 1
  grado: b2
  caracter: Cerrado, inquietante, tensión
  ascendente: [Pantera Rosa, Tiburón, Ring theme]
  descendente: [Para Elisa, Jurassic Park, Game of Thrones]
  en:
    nombre: Minor 2nd
    caracter: Closed, unsettling, tense
    ascendente: [Pink Panther, Jaws]
    descendente: [Für Elise, Jurassic Park, Game of Thrones]
  revisar: ['"Ring theme": no está claro a qué tema se refiere.']

