  caracter: Abierto, melancólico, paso suave
  ascendente: [Cumpleaños Feliz, Do–Re (escala), Frère Jacques]
  descendente: [Yesterday]
  en:
    nombre: Major 2nd
    caracter: Open, wistful, a gentle step
    ascendente: [Happy Birthday, Do–Re (scale), Frère Jacques]
    descendente: [Yesterday]

