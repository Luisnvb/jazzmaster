  formula: ['1', '2', '3', '#4', '#5', '6', '7']
- id: pentatonica-mayor
  nombre: Pentatónica mayor
  en: { nombre: Major pentatonic }
  grupo: maj7
  formula: ['1', '2', '3', '5', '6']

