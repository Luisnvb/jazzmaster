# Diccionario de escalas. `grupo` es el id de un tipo de acorde de grupos.yaml.
# El orden dentro de cada grupo es el de esta lista. `en.nombre`: nombre en la versión inglesa.

# Maj7
- id: jonico
  nombre: Jónico
  en: { nombre: Ionian }
  grupo: maj7
  formula: ['1', '2', '3', '4', '5', '6', '7']
- id: lidio
  nombre: Lidio
  en: { nombre: Lydian }
  grupo: maj7
  formula: ['1', '2', '3', '#4', '5', '6', '7']
- id: lidio-s2
  nombre: 'Lidio #2'
