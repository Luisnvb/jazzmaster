# Patrones para practicar escalas y arpegios.
#
#   sobre:      escala (las notas de la escala elegida) o arpegio (las del acorde elegido)
#   celula:     posiciones a partir de cada nota: 0 = la nota de partida, 1 = la siguiente,
#               2 = dos más arriba… Con «-» o «+» detrás, un semitono por debajo o por encima
#               de esa nota (aproximación cromática). Ej.: [0, 1, 2] → 1-2-3, 2-3-4, 3-4-5…
#   idaYVuelta: false para tocarlo solo subiendo (por defecto sube y baja).
#
# Los valores con «-» o «+» van entre comillas.

# Escalas
- id: terceras
  nombre: Terceras
  descripcion: 'Saltos de tercera: 1-3, 2-4, 3-5…'
  sobre: escala
  celula: [0, 2]

- id: grupos-3
  nombre: Grupos de 3
  descripcion: '1-2-3, 2-3-4, 3-4-5…'
  sobre: escala
  celula: [0, 1, 2]

- id: grupos-4
  nombre: Grupos de 4
  descripcion: '1-2-3-4, 2-3-4-5…'
  sobre: escala
  celula: [0, 1, 2, 3]

- id: cuartas
  nombre: Cuartas
  descripcion: 'Saltos de cuarta: 1-4, 2-5, 3-6…'
  sobre: escala
  celula: [0, 3]

- id: patron-1235
  nombre: '1-2-3-5'
  descripcion: 'La célula de Coltrane sobre cada grado.'
  sobre: escala
  celula: [0, 1, 2, 4]

- id: triadas-diatonicas
  nombre: Tríadas diatónicas
  descripcion: 'Tríada sobre cada grado de la escala.'
  sobre: escala
  celula: [0, 2, 4]

- id: cuatriadas-diatonicas
  nombre: Cuatriadas diatónicas
  descripcion: 'Arpegio de séptima sobre cada grado de la escala.'
  sobre: escala
  celula: [0, 2, 4, 6]

- id: rodeo
  nombre: Rodeo (enclosure)
  descripcion: 'Nota de arriba de la escala, semitono por debajo y la nota.'
  sobre: escala
  celula: [1, '0-', 0]

# Arpegios
- id: arpegio-inversiones
  nombre: Arpegio por inversiones
  descripcion: 'El arpegio empezando en cada una de sus notas: 1-3-5-7, 3-5-7-1…'
  sobre: arpegio
  celula: [0, 1, 2, 3]

- id: arpegio-terceras
  nombre: Arpegio a saltos
  descripcion: 'Nota sí, nota no del arpegio: 1-5, 3-7, 5-1…'
  sobre: arpegio
  celula: [0, 2]

- id: arpegio-cromatico
  nombre: Aproximación cromática al arpegio
  descripcion: 'Cada nota del arpegio, precedida por el semitono de abajo.'
  sobre: arpegio
  celula: ['0-', 0]

- id: arpegio-rodeo
  nombre: Rodeo de cada nota del arpegio
  descripcion: 'Semitono por encima, semitono por debajo y la nota.'
  sobre: arpegio
  celula: ['0+', '0-', 0]
