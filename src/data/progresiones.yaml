# Progresiones en grados romanos. La web las transporta a la tónica elegida.
#
#   compases:  un texto por compás; si hay varios acordes, separados por espacios.
#              Grado (I…VII, con b o # delante) + calidad: maj7, 6, m7, m6, mMaj7, 7,
#              9, 13, 7sus4, 7alt, 7b9, 7#9, 7#5, +, maj7#5, m7b5 (o ø7), °7…
#              Tríadas: sin sufijo (I = mayor), m (VIm = menor), ° (VII° = disminuida), sus4.
#              Inversiones: barra y la nota del acorde que va en el bajo:
#              I/3 (1.ª inversión, C/E en Do), I/5 (2.ª, C/G), V7/7 (3.ª, G7/F).
#              En un acorde menor, /3 es su tercera menor (IVm/3 → Dm/F en La).
#   pulsos:    opcional, pulsos por compás (4 por defecto).
#
# Ojo: los textos con # van entre comillas (en YAML, " #" empieza un comentario).

- id: ii-v-i-mayor
  nombre: 'ii–V–I mayor'
  descripcion: 'La cadencia básica del jazz.'
  compases: ['IIm7', 'V7', 'Imaj7', 'Imaj7']

- id: ii-v-i-menor
  nombre: 'ii–V–i menor'
  descripcion: 'Semidisminuido, dominante alterado y tónica menor.'
  compases: ['IIm7b5', 'V7alt', 'Im6', 'Im6']

- id: ii-v-corto
  nombre: 'ii–V–I en dos compases'
  descripcion: 'El ii y el V comparten compás, como en tantos standards.'
  compases: ['IIm7 V7', 'Imaj7']

- id: turnaround
  nombre: 'Turnaround I–vi–ii–V'
  descripcion: 'Para volver al principio de la forma.'
  compases: ['Imaj7 VIm7', 'IIm7 V7']

- id: turnaround-dominantes
  nombre: 'Turnaround III–VI–II–V'
  descripcion: 'Turnaround con dominantes secundarios.'
